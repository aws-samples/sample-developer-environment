Rules:
  KiroIDEArchitectureCheck:
    RuleCondition: !Equals [!Ref EnableKiroIDE, "true"]
    Assertions:
      - Assert: !Equals [!Ref InstanceArchitecture, "amd64"]
        AssertDescription: "Kiro IDE requires amd64 architecture. Please select an amd64 instance type or disable Kiro IDE."

Conditions:
  CreatePipeline: !Equals [!Ref DeployPipeline, "true"]
  EnableRotation: !Equals [!Ref RotateSecret, "true"]
  IsArm64: !Equals [!Ref InstanceArchitecture, 'arm64']
  IsAmd64: !Equals [!Ref InstanceArchitecture, "amd64"]
  HasS3Assets: !Not [!Equals [!Ref S3AssetBucket, ""]]
  EnableKiroIDE: !Equals [!Ref EnableKiroIDE, "true"]
  InstallKiroIDE: !And
    - !Condition EnableKiroIDE
    - !Condition IsAmd64

Resources:
  ### Resource Group - Groups all AWS resources for easy management and tracking
  resourcegroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Description: Sample Developer Environment Resources
      Name: !Sub ${PrefixCode}-resources
      ResourceQuery:
        Type: TAG_FILTERS_1_0
        Query:
          ResourceTypeFilters:
            - AWS::AllSupported
          TagFilters:
            - Key: solution
              Values:
                - !Sub ${SolutionTag}
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-resources
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: environment
          Value: !Sub ${EnvironmentTag}
        - Key: resourcetype
          Value: management

  ### KMS - Central encryption key for CloudWatch Logs, Secrets Manager, and other AWS services
  kmskey:
    Type: AWS::KMS::Key
    Properties:
      Description: Shared encryption key for AWS services
      PendingWindowInDays: 7
      EnableKeyRotation: true
      KeyPolicy:
        Version: 2012-10-17
        Id: key-default-1
        Statement:
          - Sid: Enable IAM User Permissions
            # https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-overview.html
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action:
              - kms:*
            Resource: "*"
          - Sid: Enable Cloudwatch access to KMS Key for VPC log group
            # https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/encrypt-log-data-kms.html
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnLike:
                "kms:EncryptionContext:aws:logs:arn": !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
      Tags:
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: environment
          Value: !Sub ${EnvironmentTag}
        - Key: resourcetype
          Value: security
  kmskeyalias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${PrefixCode}-kms-cmk
      TargetKeyId: !Ref kmskey

  ### Network Infrastructure - VPC with public/private subnets and flow logs for developer environment
  vpc01:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Sub ${VpcCidr}.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-vpc01
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: environment
          Value: !Sub ${EnvironmentTag}
        - Key: resourcetype
          Value: network
  iamrolevpcflowlogs:
    Type: AWS::IAM::Role
    # https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-cwl.html
    Properties:
      RoleName: !Sub ${PrefixCode}-iamrole-vpcflowlogs
      Description: Publish flow logs to CloudWatch Logs
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${PrefixCode}-iampolicy-VpcFlowLogsPermissions
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vpc/${PrefixCode}-flowlogs
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vpc/${PrefixCode}-flowlogs:*
                Condition:
                  StringEquals:
                    aws:SourceAccount: !Sub "${AWS::AccountId}"
                  ArnLike:
                    "aws:SourceArn": !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:*"
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-iamrole-VpcFlowLogs
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: security
        - Key: environment
          Value: !Sub ${EnvironmentTag}
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: "XXXX https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-iam-role.html"
  vpcloggroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt kmskey.Arn
      LogGroupName: !Sub /aws/vpc/${PrefixCode}-flowlogs
      RetentionInDays: 30
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-vpcflowloggroup
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: monitoring
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  vpcflowlog:
    Type: AWS::EC2::FlowLog
    Properties:
      DeliverLogsPermissionArn: !GetAtt iamrolevpcflowlogs.Arn
      LogGroupName: !Ref vpcloggroup
      ResourceId: !Ref vpc01
      ResourceType: VPC
      TrafficType: ALL
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-vpcflowlog
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: monitoring
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  internetgateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-internetgateway
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: network
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  internetgatewayattach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref vpc01
      InternetGatewayId: !Ref internetgateway
  subnetpublic01:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref vpc01
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Sub ${VpcCidr}.1.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-subnet-public01-AvailabilityZone01
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: network
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  # Second public subnet required for ALB
  subnetpublic02:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref vpc01
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Sub ${VpcCidr}.2.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-subnet-public02-AvailabilityZone02
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: network
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  subnetprivate01:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref vpc01
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Sub ${VpcCidr}.3.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-subnet-private01-AvailabilityZone01
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: network
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  elasticip01:
    Type: AWS::EC2::EIP
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-eip-AvailabilityZone01
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: network
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  natgateway01:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt elasticip01.AllocationId
      SubnetId: !Ref subnetpublic01
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-nat-public01-AvailabilityZone01
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: network
        - Key: environment
          Value: !Sub ${EnvironmentTag}
    DependsOn: internetgatewayattach
  routetablepublic:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref vpc01
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-routetable-public
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: network
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  routepublic:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref routetablepublic
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !GetAtt internetgateway.InternetGatewayId
  routeassociationpublic01:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref subnetpublic01
      RouteTableId: !Ref routetablepublic
  routeassociationpublic02:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref subnetpublic02
      RouteTableId: !Ref routetablepublic
  routetableprivate:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref vpc01
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-routetable-private1-AvailabilityZone1
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: network
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  routeprivate:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref routetableprivate
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !GetAtt natgateway01.NatGatewayId
  routeassociationprivate:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref subnetprivate01
      RouteTableId: !Ref routetableprivate

  ### Centralized logging bucket for CloudFront and S3 access logs
  s3bucketlogs:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLogs
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-logs
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: storage
        - Key: environment
          Value: !Sub ${EnvironmentTag}
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: "This is an access logs bucket and does not need its own access logging."
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: "This is an access logs bucket and does not need its own access logging."
  s3bucketpolicylogs:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref s3bucketlogs
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: EnforceSecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${s3bucketlogs}
              - !Sub arn:${AWS::Partition}:s3:::${s3bucketlogs}/*
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: Allow TLS 1.2 and above
            Effect: Deny
            Principal: "*"
            Action:
              - s3:*
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${s3bucketlogs}
              - !Sub arn:${AWS::Partition}:s3:::${s3bucketlogs}/*
            Condition:
              NumericLessThan:
                s3:TlsVersion: 1.2
          # https://docs.aws.amazon.com/elasticloadbalancing/latest/application/enable-access-logging.html
          - Sid: AllowALBLogging
            Effect: Allow
            Principal:
              Service: logdelivery.elasticloadbalancing.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${s3bucketlogs}/alb-logs/*
          - Sid: AllowALBLoggingLegacyRegions
            Effect: Allow
            Principal:
              AWS: !Sub
                - arn:${AWS::Partition}:iam::${ALBAccount}:root
                - ALBAccount: !FindInMap [RegionMap, !Ref 'AWS::Region', ALBAccount]
            Action: s3:PutObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${s3bucketlogs}/alb-logs/*
          - !If
            # BEWARE: Inline condition for artifact bucket logging - can't be grouped due to policy structure.
            - CreatePipeline
            - Sid: Allow S3 Logging Service for artifact bucket
              Effect: Allow
              Principal:
                Service: logging.s3.amazonaws.com
              Action: s3:PutObject
              Resource:
                - !Sub arn:${AWS::Partition}:s3:::${s3bucketlogs}/s3-logs/pipeline/*
              Condition:
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId
                ArnLike:
                  aws:SourceArn:
                    - !Sub arn:${AWS::Partition}:s3:::${s3bucketartifact}
            - !Ref AWS::NoValue

  ### Access Layer - ALB and CloudFront distribution for secure access to code-server
  albcodeserver:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${PrefixCode}-alb-codeserver
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref subnetpublic01
        - !Ref subnetpublic02
      SecurityGroups:
        - !Ref securitygroupalb
      LoadBalancerAttributes:
        - Key: access_logs.s3.enabled
          Value: true
        - Key: access_logs.s3.bucket
          Value: !Ref s3bucketlogs
        - Key: access_logs.s3.prefix
          Value: alb-logs
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-alb-codeserver
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: network
        - Key: environment
          Value: !Sub ${EnvironmentTag}
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: CKV_AWS_131
            reason: "ALB uses HTTP for internal AWS traffic. Security handled by CloudFront HTTPS and origin verification. Consider end-to-end HTTPS if required."
      checkov:
        skip:
          - id: CKV_AWS_131
            comment: "ALB uses HTTP for internal AWS traffic. Security handled by CloudFront HTTPS and origin verification. Consider end-to-end HTTPS if required."
  albtargetgroupcodeserver:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckPath: /login
      HealthCheckPort: 8080
      Name: !Sub ${PrefixCode}-targetgroup-codeserver
      Port: 8080
      Protocol: HTTP
      TargetType: instance
      Targets:
        - Id: !Ref ec2codeserver
      VpcId: !Ref vpc01
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-targetgroup-codeserver
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: network
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  # DCV target group for NICE DCV desktop access
  albtargetgroupdcv:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: InstallKiroIDE
    Properties:
      HealthCheckPath: /
      HealthCheckPort: 8443
      HealthCheckProtocol: HTTPS
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: 200,404  # DCV returns 404 on root path when no session is active, but service is healthy
      Name: !Sub ${PrefixCode}-targetgroup-dcv
      Port: 8443
      Protocol: HTTPS
      TargetType: instance
      Targets:
        - Id: !Ref ec2codeserver
      VpcId: !Ref vpc01
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-targetgroup-dcv
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: network
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  # ALB listener default rule blocks all traffic unless coming from CloudFront with correct secret header
  alblistenercodeserver:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: text/plain
            MessageBody: "Access Denied"
            StatusCode: 403
      LoadBalancerArn: !Ref albcodeserver
      Port: 80
      Protocol: HTTP
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W56
            reason: "ALB uses HTTP for internal AWS traffic. Security handled by CloudFront HTTPS and origin verification. Consider end-to-end HTTPS if required."
          - id: CKV_AWS_103
            reason: "TLS check not applicable - ALB uses HTTP internally. External TLS 1.2 enforced at CloudFront. Consider end-to-end HTTPS if required."
      checkov:
        skip:
          - id: CKV_AWS_2
            comment: "ALB uses HTTP for internal AWS traffic. Security handled by CloudFront HTTPS and origin verification. Consider end-to-end HTTPS if required."
          - id: CKV_AWS_103
            comment: "TLS check not applicable - ALB uses HTTP internally. External TLS 1.2 enforced at CloudFront. Consider end-to-end HTTPS if required."
  # Allow traffic only if secret header from CloudFront is present
  alblistenerrulecodeserver:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref albtargetgroupcodeserver
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: !Sub "{{resolve:secretsmanager:${cloudfrontsecretheadercodeserver}:SecretString:HeaderName}}"
            Values:
              - !Sub "{{resolve:secretsmanager:${cloudfrontsecretheadercodeserver}:SecretString:HeaderValue}}"
      ListenerArn: !Ref alblistenercodeserver
      Priority: 10
  alblistenerruledcv:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: InstallKiroIDE
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref albtargetgroupdcv
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: !Sub "{{resolve:secretsmanager:${cloudfrontsecretheadercodeserver}:SecretString:HeaderName}}"
            Values:
              - !Sub "{{resolve:secretsmanager:${cloudfrontsecretheadercodeserver}:SecretString:HeaderValue}}"
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - "/dcv*"
      ListenerArn: !Ref alblistenercodeserver
      Priority: 5
  # Security group allows traffic only from CloudFront IP ranges
  securitygroupalb:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${PrefixCode}-securitygroup-alb
      GroupDescription: ALB security group
      VpcId: !Ref vpc01
      SecurityGroupIngress:
        - Description: HTTP inbound from CloudFront
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !FindInMap [RegionMap, !Ref "AWS::Region", CloudFrontPrefixList]
      SecurityGroupEgress:
        - Description: Allow to EC2
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          DestinationSecurityGroupId: !Ref securitygroupcodeserver
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-securitygroup-alb
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: security
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  cloudfrontcachepolcodeserver:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Comment: Cache policy for VS code-server allows caching with cookie/header/query string forwarding
        DefaultTTL: 86400
        MaxTTL: 31536000
        MinTTL: 1
        Name: !Sub ${PrefixCode}-cloudfront-policy
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: all
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - Host
              - Origin
              - Authorization
          QueryStringsConfig:
            QueryStringBehavior: all
  # CloudFront distribution adds secret header to all requests to ALB
  cloudfrontdistributioncodeserver:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Origins:
          - DomainName: !GetAtt albcodeserver.DNSName
            Id: CodeServerOrigin
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
            # Add secret header to all requests to prevent direct ALB access
            OriginCustomHeaders:
              - HeaderName: !Sub "{{resolve:secretsmanager:${cloudfrontsecretheadercodeserver}:SecretString:HeaderName}}"
                HeaderValue: !Sub "{{resolve:secretsmanager:${cloudfrontsecretheadercodeserver}:SecretString:HeaderValue}}"
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - PATCH
            - POST
            - DELETE
          CachePolicyId: !Ref cloudfrontcachepolcodeserver
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3  # Managed AllViewer Policy
          TargetOriginId: CodeServerOrigin
          ViewerProtocolPolicy: redirect-to-https
        CacheBehaviors:
          # Cache behavior for NICE DCV (Kiro IDE). Only used when EnableKiroIDE is true.
          - PathPattern: /dcv*
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachePolicyId: !Ref cloudfrontcachepolcodeserver
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
            TargetOriginId: CodeServerOrigin
            ViewerProtocolPolicy: redirect-to-https
        Logging:
          Bucket: !GetAtt s3bucketlogs.DomainName
          IncludeCookies: false
          Prefix: cloudfront-logs/
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-cloudfrontdistribution-alb
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: network
        - Key: environment
          Value: !Sub ${EnvironmentTag}
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-CFR4
            reason: "CloudFront uses HTTP internally with ALB. Security handled by CloudFront HTTPS and origin verification. Consider end-to-end HTTPS if required."
          - id: AwsSolutions-CFR5
            reason: "Origin uses HTTP within AWS network. Consider end-to-end HTTPS if certificate management overhead is acceptable."
          - id: CKV_AWS_174
            reason: "Using CloudFront default certificate with TLS 1.2. Consider custom certificate if custom domain required."
          - id: AwsSolutions-CFR2
            reason: "Security handled by CloudFront origin header, IP restrictions and ALB rules. WAF needs us-east-1 deployment. Consider using StackSets for WAF if required"
          - id: CKV_AWS_68
            reason: "Security handled by CloudFront origin header, IP restrictions and ALB rules. WAF needs us-east-1 deployment. Consider using StackSets for WAF if required"
          - id: AwsSolutions-CFR1
            reason: "Geo-restrictions not implemented for flexibility. Consider enabling geo-restrictions if regional compliance or security requirements dictate."
      checkov:
        skip:
          - id: CKV_AWS_174
            comment: "Using CloudFront default certificate with TLS 1.2. Consider custom certificate if custom domain required."
          - id: CKV_AWS_68
            comment: "WAF not implemented for development environment. Security handled through CloudFront origin verification and code-server authentication. Consider WAF for production."
  cloudfrontsecretheadercodeserver:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${PrefixCode}-secret-cloudfrontheader
      Description: Origin verification header for code-server CloudFront distribution
      KmsKeyId: !GetAtt kmskey.Arn
      GenerateSecretString:
        SecretStringTemplate: '{"HeaderName": "X-Origin-Verify"}'
        GenerateStringKey: "HeaderValue"
        PasswordLength: 32
        ExcludeCharacters: '\[]{}>|*&!%#`@,."$:+=-~^()'''
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-secret-cloudfrontheader
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: security
        - Key: environment
          Value: !Sub ${EnvironmentTag}
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W77
            reason: "Secret is a static verification token between CloudFront and ALB. Rotation would require coordinated updates to both services causing downtime. Consider automated rotation if required."
          - id: AwsSolutions-SMG4
            reason: "Secret is a static verification token between CloudFront and ALB. Rotation would require coordinated updates to both services causing downtime. Consider automated rotation if required."
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-SMG4
            reason: "Secret is a static verification token between CloudFront and ALB. Rotation would require coordinated updates to both services causing downtime. Consider automated rotation if required."
  securitygroupcodeserver:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${PrefixCode}-securitygroup-codeserver
      GroupDescription: code-server security group
      VpcId: !Ref vpc01
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-securitygroup-codeserver
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: security
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  securitygroupingresscodeserver:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref securitygroupcodeserver
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref securitygroupalb
      Description: Allow inbound from ALB to codeserver
  securitygroupingressdcv:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: InstallKiroIDE
    Properties:
      GroupId: !Ref securitygroupcodeserver
      IpProtocol: tcp
      FromPort: 8443
      ToPort: 8443
      SourceSecurityGroupId: !Ref securitygroupalb
      Description: Allow inbound from ALB to NICE DCV
  securitygroupegressdcv:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: InstallKiroIDE
    Properties:
      GroupId: !Ref securitygroupalb
      IpProtocol: tcp
      FromPort: 8443
      ToPort: 8443
      DestinationSecurityGroupId: !Ref securitygroupcodeserver
      Description: Allow outbound from ALB to NICE DCV

  ### Authentication - Secrets Manager storing credentials for code-server access and CloudFront origin verification
  secretcodeserver:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${PrefixCode}-secret-codeserver
      Description: Initial code-server password. If rotation enabled, refer to the rotating secret after 30 days.
      KmsKeyId: !GetAtt kmskey.Arn
      GenerateSecretString:
        SecretStringTemplate: '{"username": "ec2-user"}'
        GenerateStringKey: "password"
        PasswordLength: 16
        ExcludeCharacters: '\[]{}>|*&!%#`@,."$:+=-~^()'''
        RequireEachIncludedType: true
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-secret-codeserver
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: security
        - Key: environment
          Value: !Sub ${EnvironmentTag}
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: AwsSolutions-SMG4
            reason: "This is the initial deployment secret only. For automated rotation, enable the RotateSecret parameter which creates and uses secretcodeserverrotating instead."
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-SMG4
            reason: "This is the initial deployment secret only. For automated rotation, enable the RotateSecret parameter which creates and uses secretcodeserverrotating instead."

  ### Source Control - CodeCommit repository for version control, sourcing the deployment pipeline
  codecommitrepo:
    Type: AWS::CodeCommit::Repository
    Properties:
      RepositoryName: !Sub ${PrefixCode}-repo-workspace
      RepositoryDescription: Developer workspace repository - source for the deployment pipeline
      KmsKeyId: !GetAtt kmskey.Arn
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-repo-workspace
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: storage
        - Key: environment
          Value: !Sub ${EnvironmentTag}

  ### Development Environment - EC2 instance running code-server with developer tools and git integration
  iamrolecodeserver:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${PrefixCode}-iamrole-codeserver
      Description: Code-server EC2 Instance Profile
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${PrefixCode}-iampolicy-EC2
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeTags
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:SourceAccount: !Ref AWS::AccountId
        # https://docs.aws.amazon.com/systems-manager/latest/userguide/security_iam_service-with-iam.html
        - PolicyName: !Sub ${PrefixCode}-iampolicy-codeserver-SystemsManager
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ssm:StartSession
                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-StartPortForwardingSession
        # SSM agent registration and command delivery (least-privilege subset of AmazonSSMManagedInstanceCore).
        # Required for Run Command: secret rotation Lambda and manual setup re-runs use ssm send-command.
        # These actions do not support resource-level permissions.
        - PolicyName: !Sub ${PrefixCode}-iampolicy-codeserver-ssmagent
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ssm:UpdateInstanceInformation
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                  - ec2messages:AcknowledgeMessage
                  - ec2messages:DeleteMessage
                  - ec2messages:FailMessage
                  - ec2messages:GetEndpoint
                  - ec2messages:GetMessages
                  - ec2messages:SendReply
                Resource: "*"
        - PolicyName: !Sub ${PrefixCode}-iampolicy-codeserver-CloudWatch
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/ec2/${PrefixCode}-codeserver
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/ec2/${PrefixCode}-codeserver:*
        - PolicyName: !Sub ${PrefixCode}-iampolicy-codeserver-KMS
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:GenerateDataKey
                Resource:
                  - !GetAtt kmskey.Arn
        - PolicyName: !Sub ${PrefixCode}-iampolicy-codeserver-secretsmanager
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Ref secretcodeserver
        - PolicyName: !Sub ${PrefixCode}-iampolicy-codeserver-codecommit
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - codecommit:GitPull
                  - codecommit:GitPush
                  - codecommit:GetBranch
                Resource: !GetAtt codecommitrepo.Arn
        - PolicyName: !Sub ${PrefixCode}-iampolicy-codeserver-SSM
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${PrefixCode}/config/AmazonCloudWatch-linux
              # Instance fetches its setup script from the SSM document on every boot
              - Effect: Allow
                Action:
                  - ssm:GetDocument
                  - ssm:DescribeDocument
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${PrefixCode}-document-devbox-setup
        - !If
          - InstallKiroIDE
          - PolicyName: !Sub ${PrefixCode}-iampolicy-dcv-license
            PolicyDocument:
              Version: 2012-10-17
              Statement:
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub arn:${AWS::Partition}:s3:::dcv-license.${AWS::Region}/*
          - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-iamrole-codeserver
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: security
        - Key: environment
          Value: !Sub ${EnvironmentTag}
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: "EC2 instance requires describe permissions. Access limited by SourceAccount condition, specific actions, and scoped resources for S3, KMS, and Secrets Manager."
  iaminstanceprofilecodeserver:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${PrefixCode}-iamprofile-ec2admin
      Roles:
        - !Ref iamrolecodeserver
  # EC2 keypair is automatically stored in AWS Systems Manager Parameter Store
  ec2keypaircodeserver:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub ${PrefixCode}-ec2-keypair
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-ec2-keypair
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: security
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  ec2loggroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt kmskey.Arn
      LogGroupName: !Sub /aws/ec2/${PrefixCode}-codeserver
      RetentionInDays: 14
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-ec2loggroup
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: monitoring
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  ssmparametercloudwatchlinux:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${PrefixCode}/config/AmazonCloudWatch-linux
      Type: String
      Value: !Sub |
        {
          "logs": {
            "logs_collected": {
              "files": {
                "collect_list": [
                  {
                    "file_path": "/var/log/cloud-init-output.log",
                    "log_group_name": "/aws/ec2/${PrefixCode}-codeserver",
                    "log_stream_name": "bootstrap"
                  },
                  {
                    "file_path": "/var/log/devbox-setup.log",
                    "log_group_name": "/aws/ec2/${PrefixCode}-codeserver",
                    "log_stream_name": "setup"
                  }
                ]
              }
            }
          }
        }
      Description: CloudWatch Agent configuration for linux instances
      Tags:
        Name: !Sub ${PrefixCode}-ssm-cloudwatch-linux
        provisioner: CFN
        solution: !Sub ${SolutionTag}
        resourcetype: monitoring
        environment: !Sub ${EnvironmentTag}
  # Devbox setup script embedded as an SSM document, keeping the solution self-contained in this template.
  # The instance downloads it via ssm:GetDocument on every boot (idempotent, step-tracked).
  # Re-run on a live instance: aws ssm send-command --document-name <name> --instance-ids <id>
  # No !Sub on Content - all runtime values come from /etc/devbox-env.sh written by UserData.
  ssmdocumentsetup:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub ${PrefixCode}-document-devbox-setup
      DocumentType: Command
      DocumentFormat: YAML
      UpdateMethod: NewVersion
      TargetType: /AWS::EC2::Instance
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-document-devbox-setup
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: management
        - Key: environment
          Value: !Sub ${EnvironmentTag}
      Content:
        schemaVersion: '2.2'
        description: Devbox setup - installs code-server, developer tools and optionally Kiro IDE (DCV). Idempotent, safe to re-run.
        mainSteps:
          - action: aws:runShellScript
            name: devboxSetup
            inputs:
              timeoutSeconds: '3600'
              runCommand:
                - |
                  #!/bin/bash
                  # Main setup script for developer environment and optional project application
                  # This script can be run multiple times on the same instance

                  # Set up logging to ensure errors are captured on every run
                  SETUP_LOG="/var/log/devbox-setup.log"
                  exec > >(tee -a $SETUP_LOG) 2>&1

                  # Serialize runs: boot-time execution and ssm send-command could overlap.
                  # Second instance blocks here until the first finishes, then skips completed steps.
                  LOCK_FILE="/var/run/devbox-setup.lock"
                  exec 200>$LOCK_FILE
                  if ! flock -n 200; then
                      echo "INFO: Another setup run is in progress, waiting for it to finish..."
                      flock 200
                      echo "INFO: Previous run finished, continuing"
                  fi

                  echo "INFO: Starting setup at $(date)"

                  # Source the environment variables
                  if [ -f /etc/devbox-env.sh ]; then
                      source /etc/devbox-env.sh
                      echo "INFO: Loaded environment variables from /etc/devbox-env.sh"
                  else
                      echo "ERROR: Environment file /etc/devbox-env.sh not found"
                      exit 1
                  fi

                  # Status file for tracking installation progress
                  STATUS_FILE="/var/lib/cloud/instance/setup-status.log"
                  touch $STATUS_FILE

                  # Function to detect architecture for downloads
                  detect_architecture() {
                    if [ "${INSTANCE_ARCHITECTURE}" = "arm64" ]; then
                      echo "aarch64"
                    else
                      echo "x86_64"
                    fi
                  }

                  # Function to check if a step has been completed successfully
                  step_completed() {
                      grep -q "^$1: \[OK\]$" $STATUS_FILE
                  }

                  # Function to mark a step as completed
                  mark_step_completed() {
                      echo "$1: [OK]" >> $STATUS_FILE
                      echo "INFO: Step '$1' completed successfully"
                  }

                  # Function to mark a step as failed
                  mark_step_failed() {
                      echo "$1: [FAILED]" >> $STATUS_FILE
                      echo "ERROR: Step '$1' failed: $2"
                  }

                  # Function to install a component with multiple steps
                  install_component() {
                      local component_name="$1"
                      local commands="$2"
                      local error_message="$3"

                      # Strip _installed from display name
                      local display_name=${component_name%_installed}

                      if ! step_completed "$component_name"; then
                          echo "INFO: Installing $display_name..."
                          if (
                              set -e  # Exit on any error
                              eval "$commands"
                          ); then
                              mark_step_completed "$component_name"
                              return 0
                          else
                              mark_step_failed "$component_name" "$error_message"
                              return 1
                          fi
                      else
                          echo "INFO: $display_name already installed, skipping"
                          return 0
                      fi
                  }

                  ##############################
                  # CORE DEVELOPER ENVIRONMENT #
                  ##############################

                  # Update system packages
                  install_component "system_updated" '
                  dnf update -y -q
                  ' "Failed to update system packages"

                  # Install CloudWatch agent
                  install_component "cloudwatch_installed" '
                  dnf install -y -q amazon-cloudwatch-agent jq

                  until aws ssm get-parameter --name /${PREFIX_CODE}/config/AmazonCloudWatch-linux --region ${AWS_REGION} &> /dev/null; do
                      echo "INFO: SSM parameter is not ready..."
                      sleep 5
                  done

                  aws ssm get-parameter \
                      --name /${PREFIX_CODE}/config/AmazonCloudWatch-linux \
                      --region ${AWS_REGION} \
                      --query "Parameter.Value" \
                      --output text > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json

                  /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config \
                      -m ec2 \
                      -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json \
                      -s
                  ' "Failed to install or configure CloudWatch agent"

                  # Create AWS profile for developer role
                  install_component "aws_profile_created" '
                  su - ec2-user -c "mkdir -p ~/.aws"
                  su - ec2-user -c "cat > ~/.aws/config << EOF
                  [profile developer]
                  role_arn = arn:aws:iam::${AWS_ACCOUNT_ID}:role/${PREFIX_CODE}-iamrole-developer
                  credential_source = Ec2InstanceMetadata
                  region = ${AWS_REGION}
                  EOF"
                  ' "Failed to create AWS profile"

                  # Install code-server
                  install_component "code_server_installed" '
                  # Install code-server package
                  dnf install https://github.com/coder/code-server/releases/download/v${CODE_SERVER_VERSION}/code-server-${CODE_SERVER_VERSION}-${INSTANCE_ARCHITECTURE}.rpm -y

                  # Create directories
                  mkdir -p /home/ec2-user/.config/code-server
                  mkdir -p /home/ec2-user/workspace
                  chown -R ec2-user:ec2-user /home/ec2-user/workspace

                  # Get password from Secrets Manager
                  echo "Retrieving password from Secrets Manager..."
                  PASSWORD=$(aws secretsmanager get-secret-value --secret-id ${SECRET_CODE_SERVER} --region ${AWS_REGION} --query SecretString --output text | jq -r .password)
                  if [ -z "$PASSWORD" ]; then
                      echo "Error: Failed to retrieve password"
                      exit 1
                  fi

                  # Create config file
                  cat > /home/ec2-user/.config/code-server/config.yaml << EOF
                  bind-addr: 0.0.0.0:8080
                  auth: password
                  password: "$PASSWORD"
                  cert: false
                  EOF

                  chmod 600 /home/ec2-user/.config/code-server/config.yaml
                  chown -R ec2-user:ec2-user /home/ec2-user/.config

                  # Create service file
                  cat > /etc/systemd/system/code-server.service << EOF
                  [Unit]
                  Description=code-server
                  After=network.target

                  [Service]
                  Type=simple
                  User=ec2-user
                  Environment=HOME=/home/ec2-user
                  WorkingDirectory=/home/ec2-user/workspace
                  ExecStart=/usr/bin/code-server --config /home/ec2-user/.config/code-server/config.yaml
                  Restart=always

                  [Install]
                  WantedBy=multi-user.target
                  EOF

                  # Create VS Code settings
                  mkdir -p /home/ec2-user/.local/share/code-server/User/
                  cat > /home/ec2-user/.local/share/code-server/User/settings.json << EOF
                  {
                    "git.enabled": true,
                    "git.path": "/usr/bin/git",
                    "git.autofetch": true,
                    "window.menuBarVisibility": "classic",
                    "workbench.startupEditor": "none",
                    "workspace.openFilesInNewWindow": "off",
                    "workbench.colorTheme": "Default Dark+",
                    "extensions.autoUpdate": false,
                    "extensions.autoCheckUpdates": false,
                    "telemetry.telemetryLevel": "off",
                    "security.workspace.trust.startupPrompt": "never",
                    "security.workspace.trust.enabled": false,
                    "security.workspace.trust.banner": "never",
                    "security.workspace.trust.emptyWindow": false,
                    "auto-run-command.rules": [
                      {
                        "command": "workbench.action.terminal.new"
                      }
                    ]
                  }
                  EOF

                  chown -R ec2-user:ec2-user /home/ec2-user/.local
                  ' "Failed to install or configure code-server"

                  # Install Terraform
                  install_component "terraform_installed" '
                  dnf config-manager --add-repo https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo
                  dnf install -y terraform
                  ' "Failed to install Terraform"

                  # Install .NET SDK
                  if [ "${INSTALL_DOTNET}" = "true" ]; then
                      install_component "dotnet_installed" '
                      dnf install -y dotnet-sdk-${DOTNET_VERSION}
                      echo "export PATH=\$PATH:/usr/bin/dotnet" >> /home/ec2-user/.bashrc
                      su - ec2-user -c "dotnet --version"
                      ' "Failed to install .NET Framework"
                  fi

                  # Install Docker
                  install_component "docker_installed" '
                  dnf install -y docker
                  systemctl start docker
                  systemctl enable docker
                  usermod -aG docker ec2-user
                  ' "Failed to install or configure Docker"

                  # Install VS Code extensions
                  install_component "extensions_installed" '
                  su - ec2-user -c "code-server --install-extension amazonwebservices.aws-toolkit-vscode --force"
                  su - ec2-user -c "code-server --install-extension hashicorp.terraform@2.40.0 --force"
                  su - ec2-user -c "code-server --install-extension ms-azuretools.vscode-docker --force"
                  ' "Failed to install one or more extensions"

                  # Start code-server service
                  if ! systemctl is-active --quiet code-server; then
                      echo "INFO: Starting code-server service..."
                      if systemctl enable code-server && systemctl start code-server; then
                          echo "INFO: code-server service started successfully"
                      else
                          echo "ERROR: Failed to start code-server service"
                      fi
                  else
                      echo "INFO: code-server service already running"
                  fi

                  # Configure git with the CodeCommit credential helper (built into the AWS CLI)
                  install_component "git_codecommit_configured" '
                  dnf install git -y -q
                  cat > /home/ec2-user/.gitconfig << '"'"'EOF'"'"'
                  [user]
                      name = EC2 User
                      email = ec2-user@example.com
                  [init]
                      defaultBranch = main
                  [credential]
                      helper = !aws codecommit credential-helper $@
                      UseHttpPath = true
                  EOF
                  chown ec2-user:ec2-user /home/ec2-user/.gitconfig
                  ' "Failed to configure git for CodeCommit"

                  # Initialize workspace from CodeCommit, seeding from S3 assets or GitHub if the repo is empty
                  if ! step_completed "workspace_initialized"; then
                      if aws codecommit get-branch --repository-name ${REPO_NAME} --branch-name main --region ${AWS_REGION} >/dev/null 2>&1; then
                          echo "INFO: Cloning existing CodeCommit repository..."
                          if su - ec2-user -c "
                              cd /home/ec2-user/workspace && \
                              git clone ${REPO_URL} my-workspace
                          "; then
                              mark_step_completed "workspace_initialized"
                          else
                              mark_step_failed "workspace_initialized" "Failed to clone CodeCommit repository"
                          fi
                      elif [ -n "${S3_ASSET_BUCKET}" ]; then
                          echo "INFO: Seeding CodeCommit repository from S3 assets..."
                          if su - ec2-user -c "
                              mkdir -p /home/ec2-user/workspace/my-workspace && \
                              cd /home/ec2-user/workspace/my-workspace && \
                              aws s3 cp --recursive s3://${S3_ASSET_BUCKET}/${S3_ASSET_PREFIX} ./ && \
                              git init && \
                              git add . && \
                              git commit -m 'Initial commit from S3 assets' && \
                              git remote add origin ${REPO_URL} && \
                              git push -u origin main
                          "; then
                              mark_step_completed "workspace_initialized"
                          else
                              mark_step_failed "workspace_initialized" "Failed to seed repository from S3"
                          fi
                      else
                          echo "INFO: Seeding CodeCommit repository from GitHub..."
                          if su - ec2-user -c "
                              cd /home/ec2-user/workspace && \
                              git clone ${GITHUB_REPO} my-workspace && \
                              cd my-workspace && \
                              git remote remove origin && \
                              git remote add origin ${REPO_URL} && \
                              git push -u origin main
                          "; then
                              mark_step_completed "workspace_initialized"
                          else
                              mark_step_failed "workspace_initialized" "Failed to seed repository from GitHub"
                          fi
                      fi
                  else
                      echo "INFO: Workspace already initialized, skipping"
                  fi

                  # Set developer profile as default
                  if [ "${AUTO_SET_DEVELOPER_PROFILE}" = "true" ] && ! step_completed "developer_profile_set"; then
                      install_component "developer_profile_set" '
                      su - ec2-user -c "echo \"export AWS_PROFILE=developer\" >> ~/.bashrc"
                      su - ec2-user -c "echo \"export AWS_REGION=${AWS_REGION}\" >> ~/.bashrc"
                      su - ec2-user -c "echo \"export AWS_ACCOUNTID=${AWS_ACCOUNT_ID}\" >> ~/.bashrc"
                      ' "Failed to set AWS profile defaults"
                  fi

                  # Install build tools for MCP servers with C extensions (pip also used by the Kiro CLI step)
                  install_component "build_tools_installed" '
                  dnf install -y gcc python3-devel python3-pip
                  ' "Failed to install build tools"

                  # Install Kiro CLI
                  install_component "kiro_cli_installed" '
                  # Download and install Kiro CLI
                  curl -fsSL https://cli.kiro.dev/install -o /tmp/install-kiro-cli.sh
                  chown ec2-user:ec2-user /tmp/install-kiro-cli.sh
                  sudo -u ec2-user bash /tmp/install-kiro-cli.sh
                  rm -f /tmp/install-kiro-cli.sh

                  # Install other prerequisites
                  pip3 install uv==${UV_VERSION}
                  pip3 show uv || exit 1
                  pip3 install uvenv==${UVENV_VERSION}
                  pip3 show uvenv || exit 1
                  ' "Failed to set up Kiro prerequisites"

                  # Install Session Manager plugin for ECS Exec
                  install_component "session_manager_plugin_installed" '
                  ARCH=$(detect_architecture)
                  if [ "$ARCH" = "aarch64" ]; then
                      dnf install -y https://s3.amazonaws.com/session-manager-downloads/plugin/latest/linux_arm64/session-manager-plugin.rpm
                  else
                      dnf install -y https://s3.amazonaws.com/session-manager-downloads/plugin/latest/linux_64bit/session-manager-plugin.rpm
                  fi
                  ' "Failed to install Session Manager plugin"

                  # Install Kiro IDE
                  if [ "${ENABLE_KIRO_IDE}" = "true" ] && [ "${INSTANCE_ARCHITECTURE}" = "amd64" ]; then
                      # Install GNOME Desktop
                      install_component "desktop_installed" '
                      dnf groupinstall -y "Desktop"
                      dnf upgrade -y
                      systemctl set-default graphical.target
                      mkdir -p /home/ec2-user/.config
                      touch /home/ec2-user/.config/gnome-initial-setup-done
                      chown -R ec2-user:ec2-user /home/ec2-user/.config
                      ' "Failed to install desktop environment"

                      # Install NICE DCV
                      install_component "nice_dcv_installed" '
                      ARCH=$(detect_architecture)
                      rpm --import https://d1uj6qtbmh3dt5.cloudfront.net/NICE-GPG-KEY
                      cd /tmp
                      wget -q https://d1uj6qtbmh3dt5.cloudfront.net/nice-dcv-amzn2023-${ARCH}.tgz
                      tar -xzf nice-dcv-amzn2023-${ARCH}.tgz
                      cd nice-dcv-*-amzn2023-${ARCH}
                      dnf install -y nice-dcv-server-*.amzn2023.${ARCH}.rpm nice-dcv-web-viewer-*.amzn2023.${ARCH}.rpm
                      cd /tmp
                      rm -rf nice-dcv-*

                      # Install XDummy driver for console sessions
                      dnf install -y xorg-x11-drv-dummy

                      # Configure XDummy
                      mkdir -p /etc/X11
                      cat > /etc/X11/xorg.conf << EOF
                  Section "Device"
                      Identifier "DummyDevice"
                      Driver "dummy"
                      Option "UseEDID" "false"
                      VideoRam 512000
                  EndSection

                  Section "Monitor"
                      Identifier "DummyMonitor"
                      HorizSync   5.0 - 1000.0
                      VertRefresh 5.0 - 200.0
                      Option "ReducedBlanking"
                  EndSection

                  Section "Screen"
                      Identifier "DummyScreen"
                      Device "DummyDevice"
                      Monitor "DummyMonitor"
                      DefaultDepth 24
                      SubSection "Display"
                          Viewport 0 0
                          Depth 24
                          Virtual 4096 2160
                      EndSubSection
                  EndSection
                  EOF

                      # Configure DCV for automatic console session
                      mkdir -p /etc/dcv
                      cat > /etc/dcv/dcv.conf << "DCVEOF"
                  [license]
                  [log]
                  level=info
                  [session-management]
                  create-session=true
                  [session-management/defaults]
                  [session-management/automatic-console-session]
                  owner="ec2-user"
                  storage-root="%home%"
                  [display]
                  [connectivity]
                  enable-quic-frontend=true
                  web-url-path="/dcv"
                  [security]
                  authentication=system
                  DCVEOF

                      # Set ec2-user password for DCV authentication
                      PASSWORD=$(aws secretsmanager get-secret-value --secret-id "$SECRET_CODE_SERVER" --region "$AWS_REGION" --query SecretString --output text | jq -r .password)
                      echo "ec2-user:$PASSWORD" | chpasswd

                      # Enable and start DCV server
                      systemctl enable dcvserver
                      systemctl start dcvserver
                      ' "Failed to install NICE DCV"

                      # Install xdg-utils and configure Firefox as default browser for Kiro IDE authentication
                      # Required for IAM Identity Center login flow - opens Firefox automatically when authenticating
                      install_component "xdg_utils_installed" '
                      dnf install -y xdg-utils
                      sudo -u ec2-user xdg-settings set default-web-browser firefox.desktop
                      echo "export BROWSER=firefox" >> /home/ec2-user/.bashrc
                      chown ec2-user:ec2-user /home/ec2-user/.bashrc
                      ' "Failed to install xdg-utils"

                      # Kiro IDE installation
                      install_component "kiro_ide_installed" '
                      ARCH=$(detect_architecture)
                      if [ "$ARCH" != "x86_64" ]; then
                          echo "ERROR: Kiro IDE requires amd64 architecture. Current: $ARCH"
                          exit 1
                      fi
                      VERSION=$(curl -s https://prod.download.desktop.kiro.dev/stable/metadata-linux-x64-stable.json | jq -r .currentRelease)
                      curl -o /tmp/kiro-ide.tar.gz "https://prod.download.desktop.kiro.dev/releases/stable/linux-x64/signed/$VERSION/tar/kiro-ide-$VERSION-stable-linux-x64.tar.gz"
                      mkdir -p /opt/kiro-ide
                      tar -xzf /tmp/kiro-ide.tar.gz -C /opt/kiro-ide --strip-components=1
                      rm /tmp/kiro-ide.tar.gz
                      chown -R ec2-user:ec2-user /opt/kiro-ide
                      # Create symlink for easier access
                      ln -sf /opt/kiro-ide/kiro /usr/local/bin/kiro-ide
                      # Add to applications menu
                      cat > /usr/share/applications/kiro-ide.desktop << "KIROEOF"
                  [Desktop Entry]
                  Version=1.0
                  Type=Application
                  Name=Kiro IDE
                  Icon=/opt/kiro-ide/resources/app/resources/linux/code.png
                  Exec=/opt/kiro-ide/kiro
                  Terminal=false
                  Categories=Development;IDE;
                  KIROEOF
                      chmod 644 /usr/share/applications/kiro-ide.desktop
                      ' "Failed to install Kiro IDE"

                      # Copy Kiro configs from workspace to home directory
                      if [ -d "/home/ec2-user/workspace/my-workspace/.kiro" ]; then
                          echo "INFO: Copying Kiro configs from workspace..."
                          cp -r /home/ec2-user/workspace/my-workspace/.kiro /home/ec2-user/
                          chown -R ec2-user:ec2-user /home/ec2-user/.kiro
                          echo "INFO: Kiro configs copied successfully"

                          # Extract MCP servers from platform-engineer agent and create mcp.json for Kiro IDE
                          if [ -f "/home/ec2-user/.kiro/agents/platform-engineer.json" ]; then
                              echo "INFO: Configuring MCP servers for Kiro IDE..."
                              mkdir -p /home/ec2-user/.kiro/settings
                              jq '{mcpServers: .mcpServers}' /home/ec2-user/.kiro/agents/platform-engineer.json > /home/ec2-user/.kiro/settings/mcp.json
                              chown ec2-user:ec2-user /home/ec2-user/.kiro/settings/mcp.json
                              echo "INFO: MCP servers configured"
                          fi
                      fi
                  elif [ "${ENABLE_KIRO_IDE}" = "true" ]; then
                      echo "WARNING: Kiro IDE requires amd64 architecture. Skipping Kiro IDE installation."
                  fi

                  # Print summary of installation
                  echo "INFO: Setup script completed at $(date)"
                  echo "INFO: Installation summary:"
                  echo "----------------------------------------"
                  cat $STATUS_FILE
                  echo "----------------------------------------"

                  # Check if any steps failed
                  if grep -q "\[FAILED\]" $STATUS_FILE; then
                      echo "WARNING: Some installation steps failed. Check the status file for details."
                      echo "WARNING: See full logs at $SETUP_LOG"
                      exit 1
                  else
                      echo "SUCCESS: All installation steps completed successfully."
                      echo "INFO: See full logs at $SETUP_LOG"

                      # Reboot if Kiro IDE is enabled to start graphical.target (only once)
                      if [ "${ENABLE_KIRO_IDE}" = "true" ] && [ ! -f /var/lib/cloud/instance/kiro-ide-rebooted ]; then
                          touch /var/lib/cloud/instance/kiro-ide-rebooted
                          echo "INFO: Scheduling reboot in 1 minute to start desktop environment..."
                          shutdown -r +1 "Rebooting to start graphical desktop environment"
                      fi
                      exit 0
                  fi
  ec2codeserver:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !If [IsArm64, !Ref AMIArmCodeServer, !Ref AMIx86CodeServer]
      InstanceType: !Ref InstanceType
      KeyName: !Ref ec2keypaircodeserver
      SubnetId: !Ref subnetprivate01
      IamInstanceProfile: !Ref iaminstanceprofilecodeserver
      Monitoring: true
      PrivateIpAddress: !Sub ${VpcCidr}.3.100
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            # Consider setting DeleteOnTermination to false in your own environments
            DeleteOnTermination: true
            Encrypted: true
            KmsKeyId: alias/aws/ebs
            VolumeSize: 100
            VolumeType: gp3
            Iops: 3000
      SecurityGroupIds:
        - !Ref securitygroupcodeserver
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Bootstrap: write environment file, then fetch and run the setup script from the SSM document

          echo "INFO: Starting bootstrap process at $(date)"

          # jq is required to extract the setup script from the SSM document content
          dnf install -y -q jq

          # Define all variables
          ENV_FILE="/etc/devbox-env.sh" # Environment variables file
          STATUS_FILE="/var/lib/cloud/instance/setup-status.log" # Installation status tracking file
          SETUP_SCRIPT="/var/lib/cloud/scripts/per-boot/setup.sh" # Location of the setup script (runs on every boot)
          SETUP_LOG="/var/log/devbox-setup.log" # Log file for setup script output

          # Create environment file with all necessary variables
          cat > $ENV_FILE << EOF
          # Environment variables for setup

          # Pinned package versions
          export UV_VERSION="0.12.7"
          export UVENV_VERSION="3.11.0"
          export DOTNET_VERSION="10.0"

          # Variables from CloudFormation template
          export AWS_ACCOUNT_ID="${AWS::AccountId}"
          export AWS_REGION="${AWS::Region}"
          export PREFIX_CODE="${PrefixCode}"
          export REPO_NAME="${codecommitrepo.Name}"
          export REPO_URL="${codecommitrepo.CloneUrlHttp}"
          export INSTANCE_ARCHITECTURE="${InstanceArchitecture}"
          export ENABLE_KIRO_IDE="${EnableKiroIDE}"
          export CODE_SERVER_VERSION="${CodeServerVersion}"
          export GITHUB_REPO="${GitHubRepo}"
          export AUTO_SET_DEVELOPER_PROFILE="${AutoSetDeveloperProfile}"
          export S3_ASSET_BUCKET="${S3AssetBucket}"
          export S3_ASSET_PREFIX="${S3AssetPrefix}"
          export SECRET_CODE_SERVER="${secretcodeserver}"
          export INSTALL_DOTNET="${InstallDotNet}"
          export SETUP_DOCUMENT="${ssmdocumentsetup}"
          EOF

          # Make it readable by everyone but only writable by root
          chmod 644 $ENV_FILE

          # Wait for SSM agent initialization
          echo "INFO: Waiting for SSM agent initialization..."
          until systemctl is-active --quiet amazon-ssm-agent; do
            echo "INFO: SSM agent is not ready..."
            systemctl status amazon-ssm-agent
            sleep 5
          done

          # Initialize status tracking file
          touch $STATUS_FILE

          # Per-boot script: fetch the setup script from the SSM document and run it
          cat > $SETUP_SCRIPT << 'FETCHEOF'
          #!/bin/bash
          source /etc/devbox-env.sh
          aws ssm get-document --name "$SETUP_DOCUMENT" --document-format JSON --region "$AWS_REGION" --query Content --output text > /tmp/devbox-doc.json
          jq -r '.mainSteps[0].inputs.runCommand[0]' /tmp/devbox-doc.json > /tmp/devbox-setup.sh
          rm -f /tmp/devbox-doc.json
          chmod +x /tmp/devbox-setup.sh
          /tmp/devbox-setup.sh
          FETCHEOF

          chmod +x $SETUP_SCRIPT

          # Run the setup script for the first time
          echo "INFO: Running initial setup"
          $SETUP_SCRIPT
          SETUP_EXIT_CODE=$?

          # Report setup status
          if [ $SETUP_EXIT_CODE -eq 0 ]; then
            echo "INFO: Setup completed successfully"
          else
            echo "ERROR: Setup failed with exit code $SETUP_EXIT_CODE"
            echo "ERROR: Check $STATUS_FILE for details"
          fi

          # Failsafe command
          echo ""
          echo "=================================================================="
          echo "FAILSAFE COMMAND:"
          echo "To manually re-run the setup script, execute:"
          echo "sudo /var/lib/cloud/scripts/per-boot/setup.sh"
          echo "Or trigger it remotely via SSM:"
          echo "aws ssm send-command --document-name ${ssmdocumentsetup} --instance-ids <instance-id> --region ${AWS::Region}"
          echo "=================================================================="
          echo ""

          # Display important file locations
          echo "INFO: Important file locations:"
          echo "- Environment file: $ENV_FILE"
          echo "- Setup script: $SETUP_SCRIPT"
          echo "- Status file: $STATUS_FILE"
          echo "- Setup log: $SETUP_LOG"

          echo "INFO: Bootstrap process completed at $(date)"
          /opt/aws/bin/cfn-signal -e $SETUP_EXIT_CODE --stack ${AWS::StackName} --region ${AWS::Region} --resource=ec2codeserver
          exit $SETUP_EXIT_CODE
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-ec2-codeserver
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: compute
        - Key: environment
          Value: !Sub ${EnvironmentTag}
    CreationPolicy:
      ResourceSignal:
        Count: 1
        # GNOME desktop, DCV and Kiro IDE installation can exceed 15 minutes on smaller instance types
        Timeout: PT20M
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-EC29
            reason: "Development instance uses S3 for code and state persistence. Consider ASG implementation if high availability required."

  ### IMPORTANT: Developer role with elevated permissions used by both code-server AWS profile and CodeBuild pipeline to deploy sample project [static website hosted on Amazon S3] - review and adjust based on requirements
  iamroledeveloper:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${PrefixCode}-iamrole-developer
      Description: Elevated permissions for AWS infrastructure deployment and resource management
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
              AWS: !GetAtt iamrolecodeserver.Arn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${PrefixCode}-iampolicy-gitpush-KMS
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:GenerateDataKey
                Resource:
                  - !GetAtt kmskey.Arn
        - PolicyName: !Sub ${PrefixCode}-iampolicy-developer-codecommit
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - codecommit:*
                Resource: !GetAtt codecommitrepo.Arn
        - PolicyName: !Sub ${PrefixCode}-iampolicy-terraform-kms-key
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - kms:CreateKey
                  - kms:ListAliases
                Resource: "*"
              - Effect: Allow
                Action:
                  - kms:CreateGrant
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:EnableKeyRotation
                  - kms:GetKeyPolicy
                  - kms:GetKeyRotationStatus
                  - kms:ListResourceTags
                  - kms:PutKeyPolicy
                  - kms:RetireGrant
                  - kms:ScheduleKeyDeletion
                  - kms:TagResource
                Resource: !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
              - Effect: Allow
                Action:
                  - kms:CreateAlias
                  - kms:DeleteAlias
                Resource: 
                  - !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/*
                  - !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
        - PolicyName: !Sub ${PrefixCode}-iampolicy-terraform-s3
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                Resource: 
                  - "*"
              - Effect: Allow
                Action:
                  - s3:*
                Resource: 
                  - !Sub arn:${AWS::Partition}:s3:::${PrefixCode}-*
                  - !Sub arn:${AWS::Partition}:s3:::${PrefixCode}-*/*
        - PolicyName: !Sub ${PrefixCode}-iampolicy-terraform-cloudfront
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - cloudfront:*
                Resource: 
                  - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
                  - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-access-control/*
                  - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:response-headers-policy/*
        - PolicyName: !Sub ${PrefixCode}-iampolicy-terraform-waf
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - wafv2:ListWebACLs
                Resource: "*"
              - Effect: Allow
                Action:
                  - wafv2:CreateWebACL
                  - wafv2:DeleteWebACL
                  - wafv2:GetWebACL
                  - wafv2:UpdateWebACL
                  - wafv2:ListTagsForResource
                  - wafv2:TagResource
                  - wafv2:UntagResource
                  - wafv2:AssociateWebACL
                  - wafv2:DisassociateWebACL
                  - wafv2:GetManagedRuleSet
                  - wafv2:ListAvailableManagedRuleGroups
                Resource:
                  - !Sub arn:${AWS::Partition}:wafv2:us-east-1:${AWS::AccountId}:global/webacl/*
                  - !Sub arn:${AWS::Partition}:wafv2:us-east-1:${AWS::AccountId}:global/managedruleset/*
                  - !Sub arn:${AWS::Partition}:wafv2:us-east-1:${AWS::AccountId}:global/managedruleset/*/*
        - PolicyName: !Sub ${PrefixCode}-iampolicy-ec2codebuild
          PolicyDocument:
            Version: 2012-10-17
            Statement:          
              - Effect: Allow
                Action:
                  - ec2:DescribeDhcpOptions
                  - ec2:DescribeInstances # test aws cli commands
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                  - ec2:DeleteNetworkInterface
                  - ec2:CreateNetworkInterface
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-iamrole-developer
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: security
        - Key: environment
          Value: !Sub ${EnvironmentTag}
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: "Role scoped to prefix-matched S3 buckets and account-specific resources. Wildcard required for EC2/CodeBuild networking. Consider further restrictions if required."
      cfn_nag:
        rules_to_suppress:
          - id: F3
            reason: "Developer role requires broad permissions for infrastructure deployment. Scoped to specific resources and account. Consider further restrictions if required."
  # Policy allowing code-server user to assume the developer role
  iamrolepolicyassumedeveloper:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${PrefixCode}-iampolicy-assume-Developer
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: !GetAtt iamroledeveloper.Arn
      Roles:
        - !Ref iamrolecodeserver
  # Policy allowing code-server to copy files from source S3 bucket for workspace initialization
  iampolicyS3Assets:
    Type: AWS::IAM::RolePolicy
    Condition: HasS3Assets
    Properties:
      RoleName: !Ref iamrolecodeserver
      PolicyName: !Sub ${PrefixCode}-iampolicy-s3-assets
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: s3:ListAllMyBuckets
            Resource: "*"
          - Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetObject
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${S3AssetBucket}
              - !Sub arn:${AWS::Partition}:s3:::${S3AssetBucket}/${S3AssetPrefix}*

  ### CI/CD - CodeBuild and CodePipeline for automated infrastructure deployment via Terraform
  # S3 bucket for codepipeline artifacts AND TERRAFORM STATE!
  s3bucketartifact:
    Type: AWS::S3::Bucket
    Condition: CreatePipeline
    DeletionPolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              KMSMasterKeyID: !Ref kmskeyalias
              SSEAlgorithm: aws:kms
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        DestinationBucketName: !Ref s3bucketlogs
        LogFilePrefix: s3-logs/pipeline/
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: storage
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  s3bucketpolicyartifact:
    Type: AWS::S3::BucketPolicy
    Condition: CreatePipeline
    Properties:
      Bucket: !Ref s3bucketartifact
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: EnforceSecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${s3bucketartifact}
              - !Sub arn:${AWS::Partition}:s3:::${s3bucketartifact}/*
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: EnforceTLSVersion
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${s3bucketartifact}
              - !Sub arn:${AWS::Partition}:s3:::${s3bucketartifact}/*
            Condition:
              NumericLessThan:
                s3:TlsVersion: 1.2
  # Pipeline-specific permissions for iamroledeveloper conditional on DeployPipeline
  iamroledeveloperpipeline:
    Type: AWS::IAM::RolePolicy
    Condition: CreatePipeline
    Properties:
      RoleName: !Ref iamroledeveloper
      PolicyName: !Sub ${PrefixCode}-iampolicy-pipeline
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
              - s3:GetBucketVersioning
              - s3:PutObjectVersionAcl
              - s3:GetObjectVersionAcl
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${s3bucketartifact}
              - !Sub arn:${AWS::Partition}:s3:::${s3bucketartifact}/*
          - Effect: Allow
            Action: ec2:CreateNetworkInterfacePermission
            Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
            Condition:
              StringEquals:
                ec2:AuthorizedService: codebuild.amazonaws.com
              ArnEquals:
                ec2:Subnet:
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${subnetprivate01}
  # Terraform apply CodeBuild Project
  codebuildprojectbuild:
    Type: AWS::CodeBuild::Project
    Condition: CreatePipeline
    Properties:
      Name: !Sub ${PrefixCode}-codebuildproject-terraform-build
      Description: Deploy Terraform-managed resources (automatically triggered)
      EncryptionKey: !GetAtt kmskey.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        PrivilegedMode: false
        Type: LINUX_CONTAINER
      ServiceRole: !GetAtt iamroledeveloper.Arn
      Source:
        Type: NO_SOURCE
        BuildSpec: !Sub |
          version: 0.2
          phases:
            install:
              commands:
                # Install Terraform latest version
                - yum install -y yum-utils
                - yum-config-manager --add-repo https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo
                - yum -y install terraform
                - terraform --version
            pre_build:
              commands:
                # Initialize Terraform using shared pipeline/state bucket
                - cd release
                - terraform init -backend-config="bucket=${s3bucketartifact}" -backend-config="region=${AWS::Region}"
            build:
              commands:
                # Pass region and prefix to Terraform to ensure created resources match IAM permissions and naming convention
                - terraform plan -var="PrefixCode=${PrefixCode}" -var="Region=${AWS::Region}"
                - terraform apply -auto-approve -var="PrefixCode=${PrefixCode}" -var="Region=${AWS::Region}"
            post_build:
              commands:
                - echo "Terraform apply completed on $(date)"
                - echo "Website URL -> https://$(terraform output -raw website_url)"
                - echo "WEBSITE_URL=https://$(terraform output -raw website_url)" >> $CODEBUILD_SRC_DIR/variables.env
              exported-variables:
                - WEBSITE_URL
      TimeoutInMinutes: 15
      VpcConfig:
        VpcId: !Ref vpc01
        Subnets:
          - !Ref subnetprivate01
        SecurityGroupIds:
          - !Ref securitygroupcodeserver
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-codebuildproject-terraform-build
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: devops
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  # Terraform destroy CodeBuild Project
  codebuildprojectdestroy:
    Type: AWS::CodeBuild::Project
    Condition: CreatePipeline
    Properties:
      Name: !Sub ${PrefixCode}-codebuildproject-terraform-destroy
      Description: Destroys Terraform-managed resources (manual trigger only)
      EncryptionKey: !GetAtt kmskey.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        PrivilegedMode: false
        Type: LINUX_CONTAINER
      ServiceRole: !GetAtt iamroledeveloper.Arn
      Source:
        Type: NO_SOURCE
        BuildSpec: !Sub |
          version: 0.2
          phases:
            install:
              commands:
                # Install Terraform latest version
                - yum install -y yum-utils
                - yum-config-manager --add-repo https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo
                - yum -y install terraform
                - terraform --version
            pre_build:
              commands:
                # Initialize Terraform using shared pipeline/state bucket
                - cd release
                - terraform init -backend-config="bucket=${s3bucketartifact}" -backend-config="region=${AWS::Region}"
            build:
              commands:
                # Pass same variables as deploy
                - terraform destroy -auto-approve -var="PrefixCode=${PrefixCode}" -var="Region=${AWS::Region}"
            post_build:
              commands:
                - echo "Terraform destroy completed on $(date)"
      TimeoutInMinutes: 15
      VpcConfig:
        VpcId: !Ref vpc01
        Subnets:
          - !Ref subnetprivate01
        SecurityGroupIds:
          - !Ref securitygroupcodeserver
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-codebuildproject-terraform-destroy
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: devops
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  iamrolepipeline:
    Type: AWS::IAM::Role
    Condition: CreatePipeline
    Properties:
      RoleName: !Sub ${PrefixCode}-iamrole-pipeline
      Description: Code pipeline access to S3
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${PrefixCode}-pipeline-codebuild
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                  - codebuild:StopBuild
                Resource:
                  - !GetAtt codebuildprojectbuild.Arn
                  - !GetAtt codebuildprojectdestroy.Arn
        - PolicyName: !Sub ${PrefixCode}-pipeline-codecommit
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - codecommit:GetBranch
                  - codecommit:GetCommit
                  - codecommit:GetRepository
                  - codecommit:UploadArchive
                  - codecommit:GetUploadArchiveStatus
                  - codecommit:CancelUploadArchive
                Resource: !GetAtt codecommitrepo.Arn
        - PolicyName: !Sub ${PrefixCode}-pipeline-s3
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketVersioning
                  - s3:PutObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${s3bucketartifact}
                  - !Sub arn:${AWS::Partition}:s3:::${s3bucketartifact}/*
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${s3bucketartifact}
        - PolicyName: !Sub ${PrefixCode}-pipeline-kms
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:ReEncrypt*
                Resource: !GetAtt kmskey.Arn
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-iamrole-pipeline
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: security
        - Key: environment
          Value: !Sub ${EnvironmentTag}
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: "Pipeline role policies scoped to specific resources. Wildcards required for S3 object access and KMS operations."
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            appliesTo:
              - "Resource::arn:<AWS::Partition>:s3:::<s3bucketartifact>/*"
              - "Action::kms:ReEncrypt*"
            reason: "Pipeline role requires S3 object-level and KMS permissions. Access scoped to the artifact bucket, CodeCommit repository and KMS key."
  # Terraform apply pipeline
  pipelinebuild:
    Type: AWS::CodePipeline::Pipeline
    Condition: CreatePipeline
    Properties:
      Name: !Sub ${PrefixCode}-pipeline-terraform-build
      RoleArn: !GetAtt iamrolepipeline.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref s3bucketartifact
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: CodeCommit
              Configuration:
                RepositoryName: !GetAtt codecommitrepo.Name
                BranchName: main
                # EventBridge rule triggers the pipeline - no polling
                PollForSourceChanges: false
              OutputArtifacts:
                - Name: SourceCode
              RunOrder: 1
              Region: !Ref AWS::Region
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref codebuildprojectbuild
              InputArtifacts:
                - Name: SourceCode
              OutputArtifacts:
                - Name: BuildOutput
              RunOrder: 1
              Region: !Ref AWS::Region
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-pipeline-terraform-build
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: devops
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  # Terraform destroy pipeline
  pipelinedestroy:
    Type: AWS::CodePipeline::Pipeline
    Condition: CreatePipeline
    Properties:
      Name: !Sub ${PrefixCode}-pipeline-terraform-destroy
      RoleArn: !GetAtt iamrolepipeline.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref s3bucketartifact
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: CodeCommit
              Configuration:
                RepositoryName: !GetAtt codecommitrepo.Name
                BranchName: main
                # EventBridge rule triggers the pipeline - no polling
                PollForSourceChanges: false
              OutputArtifacts:
                - Name: SourceCode
              RunOrder: 1
              Region: !Ref AWS::Region
        - Name: Approve
          Actions:
            - Name: ApproveDestroy
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Version: 1
                Provider: Manual
              Configuration:
                CustomData: "WARNING: This will destroy all Terraform-managed resources. Are you sure?"
              RunOrder: 1
        - Name: Destroy
          Actions:
            - Name: Destroy
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref codebuildprojectdestroy
              InputArtifacts:
                - Name: SourceCode
              RunOrder: 1
              Region: !Ref AWS::Region
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-pipeline-terraform-destroy
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: devops
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  # Trigger code pipeline on CodeCommit push to main
  iamroleeventbridge:
    Type: AWS::IAM::Role
    Condition: CreatePipeline
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${PrefixCode}-iampolicy-InvokePipeline
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${pipelinebuild}
        - PolicyName: !Sub ${PrefixCode}-iampolicy-WriteToCloudWatch
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/events/${PrefixCode}-pipeline-trigger:*
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: "Wildcard required for log stream access. Permission scoped to single log group. Consider removal if pipeline logging not required."
  eventbridgeloggroup:
    Type: AWS::Logs::LogGroup
    Condition: CreatePipeline
    Properties:
      LogGroupName: !Sub /aws/codepipeline/${PrefixCode}-pipeline
      RetentionInDays: 14
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-pipelineloggroup
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: monitoring
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  eventbridgetriggerrule:
    Type: AWS::Events::Rule
    Condition: CreatePipeline
    Properties:
      Name: !Sub ${PrefixCode}-pipeline-trigger
      EventBusName: default
      EventPattern:
        source:
          - aws.codecommit
        detail-type:
          - CodeCommit Repository State Change
        resources:
          - !GetAtt codecommitrepo.Arn
        detail:
          event:
            - referenceCreated
            - referenceUpdated
          referenceType:
            - branch
          referenceName:
            - main
      State: ENABLED
      Targets:
        - Arn: !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${pipelinebuild}
          Id: CodePipelineTarget
          RoleArn: !GetAtt iamroleeventbridge.Arn

  ### Lambda-based rotation of code-server password
  secretcodeserverrotating:
    Type: AWS::SecretsManager::Secret
    Condition: EnableRotation
    Properties:
      Name: !Sub ${PrefixCode}-secret-rotating-codeserver
      Description: Rotating code-server password that updates automatically every 30 days. This replaces the initial secret after first rotation.
      KmsKeyId: !GetAtt kmskey.Arn
      GenerateSecretString:
        SecretStringTemplate: '{"username": "ec2-user"}'
        GenerateStringKey: "password"
        PasswordLength: 16
        ExcludeCharacters: '\[]{}>|*&!%#`@,."$:+=-~^()'''
        RequireEachIncludedType: true
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-secret-rotating-codeserver
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: security
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  secretcodeserverrotationschedule:
    Type: AWS::SecretsManager::RotationSchedule
    DependsOn: lambdasecretrotationpermission
    Condition: EnableRotation
    Properties:
      SecretId: !Ref secretcodeserverrotating
      RotationLambdaARN: !GetAtt lambdasecretrotation.Arn
      RotationRules:
        AutomaticallyAfterDays: 30
      RotateImmediatelyOnUpdate: false
  lambdasecretrotation:
    # https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotate-secrets_lambda-functions.html
    Type: AWS::Lambda::Function
    Condition: EnableRotation
    Properties:
      Description: Lambda function to rotate code-server password
      FunctionName: !Sub ${PrefixCode}-lambda-rotation-codeserver
      Handler: index.lambda_handler
      KmsKeyArn: !GetAtt kmskey.Arn
      Runtime: python3.12
      Timeout: 300
      MemorySize: 128
      Role: !GetAtt iamrolelambda.Arn
      Environment:
        Variables:
          INSTANCE_ID: !Ref ec2codeserver
          SECRETS_MANAGER_ENDPOINT: !Sub https://secretsmanager.${AWS::Region}.amazonaws.com
      TracingConfig:
        Mode: Active
      Code:
        ZipFile: |
          import boto3
          import json
          import logging
          import os

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
              arn = event['SecretId']
              token = event['ClientRequestToken']
              step = event['Step']

              # Setup the client
              service_client = boto3.client('secretsmanager', endpoint_url=os.environ['SECRETS_MANAGER_ENDPOINT'])

              # Make sure the version is staged correctly
              metadata = service_client.describe_secret(SecretId=arn)
              if not metadata['RotationEnabled']:
                  logger.error("Secret %s is not enabled for rotation" % arn)
                  raise ValueError("Secret %s is not enabled for rotation" % arn)
              versions = metadata['VersionIdsToStages']
              if token not in versions:
                  logger.error("Secret version %s has no stage for rotation of secret %s." % (token, arn))
                  raise ValueError("Secret version %s has no stage for rotation of secret %s." % (token, arn))
              if "AWSCURRENT" in versions[token]:
                  logger.info("Secret version %s already set as AWSCURRENT for secret %s." % (token, arn))
                  return
              elif "AWSPENDING" not in versions[token]:
                  logger.error("Secret version %s not set as AWSPENDING for rotation of secret %s." % (token, arn))
                  raise ValueError("Secret version %s not set as AWSPENDING for rotation of secret %s." % (token, arn))

              if step == "createSecret":
                  create_secret(service_client, arn, token)
              elif step == "setSecret":
                  set_secret(service_client, arn, token)
              elif step == "testSecret":
                  test_secret(service_client, arn, token)
              elif step == "finishSecret":
                  finish_secret(service_client, arn, token)
              else:
                  raise ValueError("Invalid step parameter")

          def create_secret(service_client, arn, token):
              """Create the secret"""
              # Get current secret to keep username
              current_secret = service_client.get_secret_value(
                  SecretId=arn,
                  VersionStage="AWSCURRENT"
              )
              current_dict = json.loads(current_secret['SecretString'])

              # Generate new password using same rules as original secret
              passwd = service_client.get_random_password(
                  ExcludeCharacters='\[]{}>|*&!%#`@,."$:+=-~^()',
                  PasswordLength=16,
                  RequireEachIncludedType=True
              )

              # Create new secret with existing username and new password
              new_secret = {
                  'username': current_dict['username'],
                  'password': passwd['RandomPassword']
              }

              # Put the secret
              service_client.put_secret_value(
                  SecretId=arn,
                  ClientRequestToken=token,
                  SecretString=json.dumps(new_secret),
                  VersionStages=['AWSPENDING']
              )
              logger.info(f"createSecret: Successfully put secret for ARN {arn} and version {token}")

          def set_secret(service_client, arn, token):
              """Set the secret in code-server"""
              # Get the pending secret
              pending_secret = service_client.get_secret_value(
                  SecretId=arn,
                  VersionStage="AWSPENDING"
              )
              pending_dict = json.loads(pending_secret['SecretString'])

              # Use SSM to update code-server config
              ssm = boto3.client('ssm')
              instance_id = os.environ['INSTANCE_ID']

              response = ssm.send_command(
                  InstanceIds=[instance_id],
                  DocumentName='AWS-RunShellScript',
                  Parameters={
                      'commands': [
                          'cat > /home/ec2-user/.config/code-server/config.yaml << EOL\n'
                          'bind-addr: 0.0.0.0:8080\n'
                          'auth: password\n'
                          f'password: {pending_dict["password"]}\n'
                          'cert: false\n'
                          'EOL',
                          'systemctl restart code-server'
                      ]
                  }
              )
              logger.info(f"setSecret: Updated code-server config for instance {instance_id}")

          def test_secret(service_client, arn, token):
              """Test the secret"""
              # Check if code-server service is running
              ssm = boto3.client('ssm')
              instance_id = os.environ['INSTANCE_ID']

              response = ssm.send_command(
                  InstanceIds=[instance_id],
                  DocumentName='AWS-RunShellScript',
                  Parameters={
                      'commands': ['systemctl is-active code-server']
                  }
              )
              logger.info(f"testSecret: Verified code-server is running on {instance_id}")

          def finish_secret(service_client, arn, token):
              """Finish the secret"""
              # First describe the secret to get the current version
              metadata = service_client.describe_secret(SecretId=arn)
              current_version = None
              for version in metadata["VersionIdsToStages"]:
                  if "AWSCURRENT" in metadata["VersionIdsToStages"][version]:
                      if version == token:
                          # The correct version is already marked as current, return
                          logger.info("finishSecret: Version %s already marked as AWSCURRENT for %s" % (version, arn))
                          return
                      current_version = version
                      break

              # Finalize by staging the secret version current
              service_client.update_secret_version_stage(
                  SecretId=arn,
                  VersionStage="AWSPENDING",
                  RemoveFromVersionId=token
              )
              service_client.update_secret_version_stage(
                  SecretId=arn,
                  VersionStage="AWSCURRENT",
                  MoveToVersionId=token,
                  RemoveFromVersionId=current_version
              )
              logger.info("finishSecret: Successfully set AWSCURRENT stage to version %s for secret %s." % (token, arn))
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-lambda-rotation-codeserver
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: compute
        - Key: environment
          Value: !Sub ${EnvironmentTag}
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-L1
            reason: "Using latest supported Python runtime (3.12). Will be updated when new versions are available."
      checkov:
        skip:
          - id: CKV_SECRET_6
            comment: "False positive - detecting event token and generated password variables in Lambda rotation function. No hardcoded secrets present."
  lambdasecretrotationpermission:
    Type: AWS::Lambda::Permission
    Condition: EnableRotation
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref lambdasecretrotation
      Principal: secretsmanager.amazonaws.com
  iamrolelambda:
    Type: AWS::IAM::Role
    Condition: EnableRotation
    Properties:
      RoleName: !Sub ${PrefixCode}-role-secretrotation-codeserver
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Name
          Value: !Sub ${PrefixCode}-role-secretrotation-codeserver
        - Key: provisioner
          Value: CFN
        - Key: solution
          Value: !Sub ${SolutionTag}
        - Key: resourcetype
          Value: security
        - Key: environment
          Value: !Sub ${EnvironmentTag}
  iamrolepolicylambdarotation:
    Type: AWS::IAM::Policy
    Condition: EnableRotation
    Properties:
      PolicyName: !Sub ${PrefixCode}-iampolicy-rotation-secret-access
      Roles:
        - !Ref iamrolelambda
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
